name: tmp-regenerar-contrato
on:
  pull_request:
jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
      - name: Regenerar o instantâneo do contrato
        run: |
          cp tests/unit/__contrato__/modulo-contrato.json /tmp/contrato-antigo.json
          rm tests/unit/__contrato__/modulo-contrato.json
          UPDATE_CONTRATO=1 pnpm exec vitest run tests/unit/modulo-contrato-congelado.test.ts --project produto 2>&1 | tail -30
      - name: Resumo do que mudou contra o antigo
        run: |
          diff <(python3 -c "import json;d=json.load(open('/tmp/contrato-antigo.json'));print(json.dumps(d['rotas'],indent=1,sort_keys=True))") <(python3 -c "import json;d=json.load(open('tests/unit/__contrato__/modulo-contrato.json'));print(json.dumps(d['rotas'],indent=1,sort_keys=True))") | head -60 || true
      - name: Resumo do que mudou
        run: |
          git diff --stat -- tests/unit/__contrato__/modulo-contrato.json || true
          git diff -- tests/unit/__contrato__/modulo-contrato.json | grep -E "^[-+]" | grep -vE "^(\+\+\+|---)" | cut -c1-160 | head -80 || true
      - uses: actions/upload-artifact@v4
        with:
          name: contrato
          path: tests/unit/__contrato__/modulo-contrato.json
