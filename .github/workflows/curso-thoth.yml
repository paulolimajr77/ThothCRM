name: curso-thoth

# Gera o curso em imagens (curso/) com a marca THOTH CRM. Só no fork, só na
# branch curso-thoth: nunca vai em PR ao upstream.
#
# Mesmo preparo do e2e.yml (Supabase local + baseline.sql + build de produção),
# depois: marca THOTH gravada no banco igual à da instalação oficial, semente da
# clínica de demonstração, fotos de cada lição e montagem do site. O pacote sai
# como artifact "curso-thoth".
on:
  push:
    branches: [curso-thoth]

permissions:
  contents: read

jobs:
  curso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      E2E_PORT: "3460"
      CURSO_URL: http://localhost:3460
      # vazio = todos os módulos; com nomes = rodada curta de diagnóstico
      CURSO_MODULOS: ""
      NEXT_TELEMETRY_DISABLED: "1"
      SENTRY_DSN: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tags do upstream (a versão do rodapé sai do git describe)
        run: git fetch --tags --force https://github.com/melgarafael/DeskcommCRM.git

      - name: Tirar as portas do Supabase da faixa efêmera
        run: |
          set -euo pipefail
          portas=$(grep -oE '^[[:space:]]*(shadow_)?port[[:space:]]*=[[:space:]]*[0-9]+' supabase/config.toml \
            | grep -oE '[0-9]+$' | sort -un | paste -sd, -)
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$portas"

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Subir Supabase local (sem a cadeia de migrations)
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/migrations-off
          mkdir -p supabase/migrations
          for tentativa in 1 2 3; do
            if supabase start -x studio,postgres-meta; then exit 0; fi
            supabase stop --no-backup || true
            sleep $((tentativa * 30))
          done
          exit 1

      - name: Habilitar extensões exigidas pelo baseline
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists vector with schema public;
          create extension if not exists citext with schema public;
          create extension if not exists pg_trgm with schema public;
          SQL

      - name: Aplicar o baseline.sql
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -q -f supabase/baseline.sql

      - name: Semear a chave de cifra dos segredos (o que o install.sh faz)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q \
            -c "insert into private.app_secrets (name, value) values ('nuvemshop_oauth_key', '$(openssl rand -hex 32)') on conflict (name) do nothing;"

      - name: Reiniciar o Realtime (a publication nasceu no passo anterior)
        run: |
          IDS=$(docker ps -q --filter name=supabase_realtime)
          docker restart $IDS
          sleep 10

      - name: Gerar e publicar o .env.e2e
        run: |
          set -euo pipefail
          pnpm e2e:env
          grep -vE '^[[:space:]]*(#|$)' .env.e2e >> "$GITHUB_ENV"
          # o e2e-build.sh faz `source` do arquivo: nome com espaço vai entre aspas lá
          {
            echo 'APP_NAME="THOTH CRM"'
            echo 'APP_ACCENT_HEX=#9c8d44'
          } >> .env.e2e
          {
            echo 'APP_NAME=THOTH CRM'
            echo 'APP_ACCENT_HEX=#9c8d44'
          } >> "$GITHUB_ENV"

      - name: Build de produção
        run: pnpm e2e:build

      - name: Instalar o browser
        timeout-minutes: 12
        run: pnpm exec playwright install --with-deps chromium

      - name: Criar o dono da instalação (como o install.sh)
        run: |
          cp .env.e2e .env.local
          pnpm exec tsx scripts/bootstrap-owner.ts

      # Os mesmos três arquivos e cores da instalação oficial (crm.thothcrm.com.br),
      # nos mesmos caminhos de brand-logos — o produto resolve a marca do banco.
      - name: Gravar a marca THOTH CRM no banco
        run: |
          set -euo pipefail
          ORIGEM=https://supabase.thothcrm.com.br/storage/v1/object/public/brand-logos/platform
          CLARO=65173107-4869-47c6-a87f-5d58a76e31d0
          ESCURO=5535cb7b-b1f5-41da-8d3b-864018e19352
          ICONE=bad5072e-b534-447b-b9b0-d6460d6b9b99
          for id in $CLARO $ESCURO $ICONE; do
            curl -fsS -o "/tmp/$id.png" "$ORIGEM/$id.png"
            curl -fsS -X POST "$NEXT_PUBLIC_SUPABASE_URL/storage/v1/object/brand-logos/platform/$id.png" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: image/png" -H "x-upsert: true" --data-binary "@/tmp/$id.png"
            echo
          done
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q <<SQL
          insert into public.platform_branding
            (id, app_name, accent_hex, accent_dark_hex, logo_path, logo_dark_path, favicon_path, show_powered_by, seeded_from_env)
          values
            (1, 'THOTH CRM', '#9c8d44', '#d5cb8b', 'platform/$CLARO.png', 'platform/$ESCURO.png', 'platform/$ICONE.png', true, false)
          on conflict (id) do update set
            app_name = excluded.app_name, accent_hex = excluded.accent_hex, accent_dark_hex = excluded.accent_dark_hex,
            logo_path = excluded.logo_path, logo_dark_path = excluded.logo_dark_path, favicon_path = excluded.favicon_path,
            show_powered_by = excluded.show_powered_by, seeded_from_env = false, updated_at = now();
          SQL
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atc \
            "select app_name, accent_hex, accent_dark_hex, logo_path, logo_dark_path, favicon_path from public.platform_branding"

      - name: Semear a clínica de demonstração (base)
        run: pnpm exec tsx curso/semear-demonstracao.ts

      - name: Ligar o app (sem worker, como a semente exige)
        run: |
          set -euo pipefail
          nohup pnpm exec next start --port 3460 > /tmp/app.log 2>&1 &
          for _ in $(seq 1 90); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "$CURSO_URL/login" || true)
            [ "$codigo" = "200" ] && { echo "app de pé"; exit 0; }
            sleep 2
          done
          tail -50 /tmp/app.log
          exit 1

      - name: Conferir a marca na tela de login
        run: |
          curl -s "$CURSO_URL/login" | grep -o -E 'THOTH CRM|brand-logos/platform/[^"]+' | sort -u

      - name: Fotografar cada módulo
        run: |
          set -uo pipefail
          : > /tmp/modulos-ok
          : > /tmp/modulos-falhos
          lista="${CURSO_MODULOS:-$(ls curso/licoes/*.json | xargs -n1 basename | sed 's/\.json$//')}"
          for m in $lista; do
            echo "::group::módulo $m"
            if CURSO_ANTES_DA_LICAO="pnpm exec tsx curso/semear-demonstracao.ts $m" \
               pnpm exec tsx curso/capturar.ts "$m"; then
              echo "$m" >> /tmp/modulos-ok
            else
              echo "$m" >> /tmp/modulos-falhos
            fi
            echo "::endgroup::"
          done
          echo "ok: $(paste -sd' ' /tmp/modulos-ok)"
          echo "falhos: $(paste -sd' ' /tmp/modulos-falhos)"
          [ -s /tmp/modulos-ok ]

      - name: Montar o site (só módulos com todas as fotos)
        run: |
          set -euo pipefail
          CURSO_BASE="/curso/" pnpm exec tsx curso/montar.ts $(cat /tmp/modulos-ok)

      - name: Trocar a marca do site do curso
        run: |
          set -euo pipefail
          f=curso/saida/index.html
          sed -i \
            -e 's/curso-deskcomm:feitos/curso-thoth:feitos/g' \
            -e 's/<span class="marca-d" aria-hidden="true">D<\/span>/<span class="marca-d" aria-hidden="true">T<\/span>/g' \
            -e 's/DeskComm/THOTH CRM/g' -e 's/Deskcomm/THOTH CRM/g' \
            -e 's/--oliva: #506d48;/--oliva: #7d7032;/' \
            -e 's/--oliva-forte: #41573b;/--oliva-forte: #655a28;/' \
            -e 's/--oliva-suave: #e4ebe0;/--oliva-suave: #efeadb;/' \
            -e 's/--oliva: #8fae84; --oliva-forte: #a9c49f; --oliva-suave: rgba(143, 174, 132, 0.16);/--oliva: #d5cb8b; --oliva-forte: #e3dbab; --oliva-suave: rgba(213, 203, 139, 0.16);/g' \
            "$f"
          restos=$(grep -o -i 'deskcomm' "$f" | wc -l)
          echo "citações de deskcomm que sobraram: $restos"
          grep -n -o -i '.\{40\}deskcomm.\{40\}' "$f" | head -20 || true

      - name: Empacotar
        run: |
          set -euo pipefail
          mkdir -p /tmp/pacote/curso
          cp curso/saida/index.html /tmp/pacote/curso/
          cp -r curso/saida/capturas /tmp/pacote/curso/
          cp /tmp/modulos-ok /tmp/pacote/modulos-ok.txt
          cp /tmp/modulos-falhos /tmp/pacote/modulos-falhos.txt
          mkdir -p /tmp/pacote/falhas
          cp curso/saida/falha-*.jpg /tmp/pacote/falhas/ 2>/dev/null || true
          du -sh /tmp/pacote

      - uses: actions/upload-artifact@v7
        with:
          name: curso-thoth
          path: /tmp/pacote
          retention-days: 90

      - name: Log do app (se algo falhou)
        if: failure()
        run: tail -200 /tmp/app.log || true
